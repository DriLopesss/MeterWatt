# Roda a cada pull request e a cada mudança no main:
#  - testes do backend, do aplicativo com contas, das notificações e das ferramentas (Python)
#  - contas do simulador de economia e sintaxe do aplicativo (JavaScript)
#  - teste do protocolo do PZEM (C++ no computador)
#  - compilação dos dois firmwares para o ESP32, como a Arduino IDE faria
name: Testes e compilação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Testes do backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Para testar a senha própria por medidor contra um broker de verdade
      - run: sudo apt-get update -q && sudo apt-get install -y -q mosquitto mosquitto-clients && sudo systemctl stop mosquitto
      # Pillow só nos testes: confere o tamanho dos ícones e das telas do app instalável
      - run: pip install -r src/requirements.txt pytest pillow
      - run: python -m pytest tests -q
      - name: Ensaio geral (Mosquitto + servidor + dois medidores simulados)
        run: python tools/ensaio_completo.py
        timeout-minutes: 10

  web:
    name: Testes do aplicativo (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # As contas do "E se eu…?" no navegador têm de bater com as do servidor (mesmos casos)
      - run: node tests/web/teste_economia.js
      - run: |
          node --check src/meterwatt/estatico/app.js
          node --check src/meterwatt/estatico/economia-calculo.js
          node --check src/meterwatt/estatico/graficos.js
          node --check src/meterwatt/estatico/sw.js
          node --check src/meterwatt/estatico/demonstracao.js
      - name: Demonstração em um arquivo só
        run: python3 tools/gerar_demo.py --saida "$RUNNER_TEMP/demonstracao.html"

  protocolo:
    name: Testes do firmware no computador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: g++ -std=c++11 -Wall -Wextra -Werror -o teste_pzem tests/firmware/teste_pzem_modbus.cpp
      - run: ./teste_pzem
      - run: g++ -std=c++11 -Wall -Wextra -Werror -o teste_ajustes tests/firmware/teste_ajustes.cpp
      - run: ./teste_ajustes
      - run: g++ -std=c++11 -Wall -Wextra -Werror -o teste_pareamento tests/firmware/teste_pareamento.cpp
      - run: ./teste_pareamento
      - name: Firmware num ESP32 simulado
        run: bash tests/firmware/simulado/rodar.sh

  firmware:
    name: Compilar firmware (ESP32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # O config.h de verdade nunca vai para o GitHub. Para compilar, usa-se o de exemplo.
      - name: Criar config.h a partir do exemplo
        run: |
          cp firmware/mwatt_pzem/config.example.h firmware/mwatt_pzem/config.h
          cp firmware/mwatt/config.example.h firmware/mwatt/config.h
      - uses: arduino/compile-sketches@v1
        with:
          cli-compile-flags: |
            - --warnings
            - default
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - name: PubSubClient
            - name: WiFiManager
          sketch-paths: |
            - firmware/mwatt_pzem
            - firmware/mwatt
          enable-deltas-report: false
